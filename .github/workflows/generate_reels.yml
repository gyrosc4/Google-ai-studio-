name: AI Multimodal Reels Studio

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video / Stream URL'
        required: true
        type: string
      num_reels:
        description: 'How many reels (1-5)'
        required: false
        default: '3'
        type: string
      whisper_model:
        description: 'faster-whisper model (tiny/base/small/medium)'
        required: false
        default: 'small'
        type: string

concurrency:
  group: produce-reels
  cancel-in-progress: true

jobs:
  produce-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIDEO_URL: ${{ github.event.inputs.youtube_url }}
      NUM_REELS: ${{ github.event.inputs.num_reels }}
      WHISPER_MODEL: ${{ github.event.inputs.whisper_model }}
      TIGHTEN_SILENCE: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Deno JS Runtime for yt-dlp
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libegl1 libgles2 fonts-liberation
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade --pre "yt-dlp[default]"

      - name: Preflight - syntax check all scripts
        run: |
          python -m py_compile scripts/common.py scripts/1_multimodal_director.py scripts/2_showrunner.py scripts/3_adaptive_editor.py scripts/4_deliver.py
          echo "All scripts compile OK"

      - name: Step 1 - Prep + Gemini Eyes & Ears
        run: python scripts/1_multimodal_director.py

      - name: Step 2 - ERNIE Showrunner + Critic
        run: python scripts/2_showrunner.py

      - name: Step 3 - Adaptive Edit, Motion Graphics & Sound Design
        run: python scripts/3_adaptive_editor.py

      - name: Step 4 - Deliver Masters to Telegram (size-guarded)
        run: python scripts/4_deliver.py

      - name: Archive High-Bitrate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-reels-masters
          path: final_reels/
          if-no-files-found: warn
